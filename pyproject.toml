[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autohla"
version = "0.1.0"
description = "4-digit HLA allele calling from SNP-chip genotypes"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Vũ Đình Thọ" }]
keywords = ["HLA", "imputation", "genotype", "MHC", "deep-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.23",
    "pandas>=1.5",
    "cyvcf2>=0.30",
]

[project.scripts]
autohla = "autohla.cli:main"

[tool.setuptools.packages.find]
include = ["autohla*"]
