[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autohla"
version = "0.1.1"
description = "4-digit HLA allele calling from SNP-chip genotypes"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Vũ Đình Thọ" }]
keywords = ["HLA", "imputation", "genotype", "MHC", "deep-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "torch==2.10.0",
    "numpy==2.4.2",
    "pandas==2.3.3",
    "cyvcf2==0.32.1",
]

[project.optional-dependencies]
benchmark = ["scipy==1.17.1"]
viz = ["matplotlib==3.10.8"]

[project.scripts]
autohla = "autohla.cli:main"

[tool.setuptools.packages.find]
include = ["autohla*"]
